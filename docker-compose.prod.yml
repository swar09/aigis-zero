services:

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/swar09}/aigis-frontend:${IMAGE_TAG:-latest}
    container_name: edr-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://api-backend:8080
      - NODE_ENV=production
    depends_on:
      api-backend:
        condition: service_healthy
    networks:
      - edr-net

  api-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/swar09}/aigis-api-backend:${IMAGE_TAG:-latest}
    container_name: edr-api-backend
    restart: unless-stopped
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL_NODES=postgres://${POSTGRES_USER:-edr}:${POSTGRES_PASSWORD}@postgres-nodes:5432/edr_nodes
      - DATABASE_URL_ALERTS=postgres://${POSTGRES_USER:-edr}:${POSTGRES_PASSWORD}@postgres-alerts:5432/edr_alerts
      - DATABASE_URL_LOGS=postgres://${POSTGRES_USER:-edr}:${POSTGRES_PASSWORD}@postgres-logs:5432/edr_logs
      - KAFKA_BROKERS=kafka:29092
      - FLEET_GRPC_URL=http://fleet-server:50051
    depends_on:
      postgres-nodes:
        condition: service_healthy
      postgres-alerts:
        condition: service_healthy
      postgres-logs:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      fleet-server:
        condition: service_healthy
    networks:
      - edr-net

  fleet-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/swar09}/aigis-fleet-server:${IMAGE_TAG:-latest}
    container_name: edr-fleet-server
    restart: unless-stopped
    ports:
      - "${FLEET_BIND_IP:-127.0.0.1}:${FLEET_PORT:-50051}:50051"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=50051
      - DATABASE_URL=postgres://${POSTGRES_USER:-edr}:${POSTGRES_PASSWORD}@postgres-nodes:5432/edr_nodes
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres-nodes:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - edr-net

  rule-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/swar09}/aigis-rule-engine:${IMAGE_TAG:-latest}
    container_name: edr-rule-engine
    restart: unless-stopped
    ports:
      - "${RULE_ENGINE_BIND_IP:-127.0.0.1}:${HEALTH_PORT:-8081}:8081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-edr}:${POSTGRES_PASSWORD}@postgres-alerts:5432/edr_alerts
      - KAFKA_BROKERS=kafka:29092
      - HEALTH_PORT=8081
      - RULES_DIR=/etc/aigis/rules
      - MITRE_TAXONOMY_PATH=/etc/aigis/rules/mitre/enterprise-attack-linux.json
    depends_on:
      postgres-alerts:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - edr-net

  kafka-pipeline:
    image: ${IMAGE_REGISTRY:-ghcr.io/swar09}/aigis-kafka-pipeline:${IMAGE_TAG:-latest}
    container_name: edr-kafka-pipeline
    restart: unless-stopped
    ports:
      - "${PIPELINE_BIND_IP:-127.0.0.1}:${PIPELINE_HEALTH_PORT:-8082}:8082"
    env_file:
      - .env
    environment:
      - KAFKA_BROKERS=kafka:29092
      - HEALTH_PORT=8082
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - edr-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: edr-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edr-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: edr-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_BIND_IP:-127.0.0.1}:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - edr-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.raw --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.process --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.network --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.file --partitions 8 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.auth --partitions 8 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.norm --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.heartbeats --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.alerts --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.health --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic aigis.events.dlq --partitions 4 --replication-factor 1
      echo 'Topics created.'
      "
    restart: on-failure
    networks:
      - edr-net

  db-init:
    image: postgres:16-alpine
    container_name: edr-db-init
    depends_on:
      postgres-nodes:
        condition: service_healthy
      postgres-alerts:
        condition: service_healthy
      postgres-logs:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      export PGPASSWORD=$$POSTGRES_PASSWORD
      psql -h postgres-nodes -U $$POSTGRES_USER -d edr_nodes << 'EOF'
      CREATE TABLE IF NOT EXISTS nodes (
          node_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          machine_id TEXT NOT NULL UNIQUE,
          hostname TEXT NOT NULL,
          os_version TEXT NOT NULL,
          agent_version TEXT NOT NULL,
          agent_status TEXT NOT NULL DEFAULT 'healthy',
          operator_status TEXT NOT NULL DEFAULT 'active',
          first_seen_at TIMESTAMPTZ NOT NULL DEFAULT now(),
          last_enrolled_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      CREATE INDEX IF NOT EXISTS idx_nodes_machine_id ON nodes (machine_id);
      CREATE TABLE IF NOT EXISTS enrollment_events (
          event_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          node_id UUID NOT NULL REFERENCES nodes(node_id) ON DELETE CASCADE,
          event_type TEXT NOT NULL,
          hostname TEXT NOT NULL,
          os_version TEXT NOT NULL,
          agent_version TEXT NOT NULL,
          enrolled_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      CREATE TABLE IF NOT EXISTS node_health (
          health_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          node_id UUID NOT NULL REFERENCES nodes(node_id) ON DELETE CASCADE,
          agent_status TEXT NOT NULL,
          events_buffered BIGINT NOT NULL DEFAULT 0,
          recorded_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      EOF

      psql -h postgres-alerts -U $$POSTGRES_USER -d edr_alerts << 'EOF'
      CREATE TABLE IF NOT EXISTS alerts (
          alert_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          node_id UUID NOT NULL,
          hostname TEXT NOT NULL,
          severity TEXT NOT NULL,
          source TEXT NOT NULL,
          mitre_technique_id TEXT,
          mitre_tactic TEXT,
          description TEXT NOT NULL,
          triggering_event_id TEXT,
          threat_score REAL NOT NULL DEFAULT 0.0,
          status TEXT NOT NULL DEFAULT 'open',
          created_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      CREATE INDEX IF NOT EXISTS idx_alerts_node_id ON alerts (node_id);
      CREATE INDEX IF NOT EXISTS idx_alerts_severity ON alerts (severity);
      CREATE INDEX IF NOT EXISTS idx_alerts_status ON alerts (status);
      CREATE INDEX IF NOT EXISTS idx_alerts_created_at ON alerts (created_at DESC);
      EOF

      psql -h postgres-logs -U $$POSTGRES_USER -d edr_logs << 'EOF'
      CREATE TABLE IF NOT EXISTS event_logs (
          event_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          node_id UUID NOT NULL,
          event_type TEXT NOT NULL,
          hostname TEXT NOT NULL,
          payload JSONB NOT NULL,
          raw_sequence_id TEXT,
          recorded_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      CREATE INDEX IF NOT EXISTS idx_event_logs_node_id ON event_logs (node_id);
      CREATE INDEX IF NOT EXISTS idx_event_logs_recorded_at ON event_logs (recorded_at DESC);
      EOF
      echo 'Database schemas initialized successfully.'
      "
    restart: on-failure
    networks:
      - edr-net

  postgres-logs:
    image: postgres:16-alpine
    container_name: edr-postgres-logs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: edr_logs
      POSTGRES_USER: ${POSTGRES_USER:-edr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PG_BIND_IP:-127.0.0.1}:5435:5432"
    volumes:
      - postgres_logs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edr} -d edr_logs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edr-net

  postgres-nodes:
    image: postgres:16-alpine
    container_name: edr-postgres-nodes
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: edr_nodes
      POSTGRES_USER: ${POSTGRES_USER:-edr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PG_BIND_IP:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_nodes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edr} -d edr_nodes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edr-net

  postgres-alerts:
    image: postgres:16-alpine
    container_name: edr-postgres-alerts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: edr_alerts
      POSTGRES_USER: ${POSTGRES_USER:-edr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PG_BIND_IP:-127.0.0.1}:5434:5432"
    volumes:
      - postgres_alerts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edr} -d edr_alerts"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edr-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: edr-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_BIND_IP:-127.0.0.1}:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: edr-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - edr-net

networks:
  edr-net:
    name: aigis-network
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  postgres_logs_data:
  postgres_nodes_data:
  postgres_alerts_data:
