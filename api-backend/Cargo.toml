[package]
name = "edr-api-backend"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "edr_api_backend"
path = "src/lib.rs"

[[bin]]
name = "edr-api-backend"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rdkafka = { workspace = true }
diesel = { version = "2.2", features = ["postgres", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"] }
deadpool-diesel = { version = "0.6", features = ["postgres"] }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
dotenvy = "0.15"
tonic = { workspace = true }
prost = { workspace = true }
edr-sdk = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
