services:
  postgres:
    image: postgres:16-alpine
    container_name: edr-fleet-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edr_nodes
    ports:
      - "${PG_BIND_IP:-127.0.0.1}:5433:5432"
    volumes:
      - edr_pg_data:/var/lib/postgresql/data
      - ./migrations/seed.sql:/docker-entrypoint-initdb.d/99_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edr} -d edr_nodes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  edr_pg_data:
