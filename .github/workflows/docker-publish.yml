name: Build and Publish Production Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-backend
          - fleet-server
          - kafka-pipeline
          - rule-engine
          - agent
          - frontend
      push:
        description: 'Push images to GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-backend
            dockerfile: api-backend/Dockerfile
            image_name: aigis-api-backend
          - name: fleet-server
            dockerfile: fleet-server/Dockerfile
            image_name: aigis-fleet-server
          - name: kafka-pipeline
            dockerfile: kafka-pipeline/Dockerfile
            image_name: aigis-kafka-pipeline
          - name: rule-engine
            dockerfile: rule-engine/Dockerfile
            image_name: aigis-rule-engine
          - name: agent
            dockerfile: agent/Dockerfile
            image_name: aigis-agent
            platforms: linux/amd64,linux/arm64
          - name: frontend
            dockerfile: frontend/Dockerfile
            image_name: aigis-frontend

    steps:
      - name: Check whether service is selected
        id: filter
        run: |
          if [ "${{ github.event.inputs.service }}" = "all" ] || \
             [ -z "${{ github.event.inputs.service }}" ] || \
             [ "${{ github.event.inputs.service }}" = "${{ matrix.service.name }}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Provision MITRE taxonomy and YARA rules
        if: steps.filter.outputs.should_run == 'true' && matrix.service.name == 'rule-engine'
        run: |
          chmod +x ./scripts/fetch-rules.sh
          ./scripts/fetch-rules.sh

      - name: Set up QEMU
        if: steps.filter.outputs.should_run == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.filter.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.17.1

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.should_run == 'true' && (github.event_name != 'pull_request' || github.event.inputs.push == 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        if: steps.filter.outputs.should_run == 'true'
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Extract Docker metadata
        if: steps.filter.outputs.should_run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.service.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        if: steps.filter.outputs.should_run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.service.platforms || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push == '' || github.event.inputs.push == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: mode=max
          sbom: true
